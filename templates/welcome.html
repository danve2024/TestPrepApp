{% extends "menu.html" %}

{% block content %}
<div class="content-card" style="display:flex; flex-direction:column; align-items:center; gap:20px; text-align:center; padding:30px 20px;">
  <h1 style="font-size:28px; margin:0;">Welcome back, {{ name }}!</h1>

  <div id="onrampLine" style="font-size:18px; opacity:0.9;"></div>

  <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:8px;">
    <a class="start" href="{{ url_for('lessons') }}" style="text-decoration:none; padding:10px 16px; border-radius:8px;">Go to Lessons</a>
    <a class="start" href="{{ url_for('vocabulary') }}" style="text-decoration:none; padding:10px 16px; border-radius:8px;">Practice Vocabulary</a>
    <a class="start" href="{{ url_for('score') }}" style="text-decoration:none; padding:10px 16px; border-radius:8px;">View Progress</a>
  </div>
</div>

<script>
  (function(){
    const lines = [
      "Where do you want to start today?",
      "What will you focus on today?",
      "Pick your path for today.",
      "Ready to dive in? Choose your next step.",
      "What should we work on first?",
      "Let’s get started—what’s your move?",
      "Choose how you’d like to practice today.",
      "Set your focus for today.",
      "What would you like to improve right now?",
      "Your practice, your way—where to?",
      "Start strong—what’s on today’s agenda?",
      "Select your training for today."
    ];
    const preferred = 0; // index of my pick
    const el = document.getElementById('onrampLine');
    if (el) el.textContent = lines[preferred];
  })();
</script>
{% endblock %}
